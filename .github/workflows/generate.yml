name: Generate Architecture Diagram

on:
  push:
    paths:
      - "architecture.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Root Dependencies
        run: npm install

      - name: Build React App
        run: |
          cd renderer
          npm install
          npm run build

      - name: Run Puppeteer Capture
        run: npx ts-node --esm generate-diagram.ts

      - name: Commit and Push Image
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output-diagram.png
          # The [skip ci] tag prevents an infinite loop of workflows
          git commit -m "chore: auto-generate architecture diagram [skip ci]" || echo "No changes to commit"
          git push
